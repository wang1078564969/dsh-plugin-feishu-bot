# This package's composition layer, applied when the package is installed into a
# profile with `dsh plugin --profile <name> add dsh-plugin-feishu-bot`.
#
# WHY A BUNDLE. A package that declares `dsh.bundle.patch` joins the profile's
# `dsh.profile.bundles` layer stack automatically, so installing the package is
# the whole installation: no hand-edited composition, and `dsh plugin remove`
# takes it back out. The path below is relative to THIS file, which keeps the
# row inside the package wherever npm puts it.
#
# THE ID IS THE HANDLE. A user who wants to configure or disable this row does
# it by id in their own profile `cordis.patch.yml`, which is applied after every
# bundle layer:
#
#   - id: feishu-bot
#     disabled: true
#
# or, to pin configuration without editing the package:
#
#   - id: feishu-bot
#     config:
#       transport: webhook
#
# Configuration itself lives in a file, not in this row — see README
# "Configuration". Every setting has an environment-variable override, so a
# deployment can keep credentials out of the file entirely.
- insert:
    - id: feishu-bot
      name: ./lib/index.js
